name: Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_READY: ${{ secrets.LULUCALENDAR_KEYSTORE_BASE64 != '' && secrets.LULUCALENDAR_KEYSTORE_PASSWORD != '' && secrets.LULUCALENDAR_KEY_ALIAS != '' && secrets.LULUCALENDAR_KEY_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore LuluCalendar signing key
        if: env.SIGNING_READY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.LULUCALENDAR_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/lulucalendar-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lulucalendar-signing/LuluCalendar-release.jks"

      - name: Build signed release APK
        if: env.SIGNING_READY == 'true'
        env:
          LULUCALENDAR_KEYSTORE_FILE: ${{ runner.temp }}/lulucalendar-signing/LuluCalendar-release.jks
          LULUCALENDAR_KEYSTORE_PASSWORD: ${{ secrets.LULUCALENDAR_KEYSTORE_PASSWORD }}
          LULUCALENDAR_KEY_ALIAS: ${{ secrets.LULUCALENDAR_KEY_ALIAS }}
          LULUCALENDAR_KEY_PASSWORD: ${{ secrets.LULUCALENDAR_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build debug APK fallback
        if: env.SIGNING_READY != 'true'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          if [ "$SIGNING_READY" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk LuluCalendar-v0.0.1.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk LuluCalendar-v0.0.1.apk
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuluCalendar-v0.0.1
          path: LuluCalendar-v0.0.1.apk
          if-no-files-found: error

      - name: Publish v0.0.1 Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release v0.0.1]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.0.1 >/dev/null 2>&1; then
            gh release upload v0.0.1 LuluCalendar-v0.0.1.apk --clobber
          else
            gh release create v0.0.1 LuluCalendar-v0.0.1.apk \
              --target "$GITHUB_SHA" \
              --title "LuluCalendar v0.0.1" \
              --notes "LuluCalendar v0.0.1"
          fi
