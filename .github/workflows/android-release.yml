name: Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LuluCalendar-v0.0.1.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuluCalendar-v0.0.1
          path: LuluCalendar-v0.0.1.apk
          if-no-files-found: error

      - name: Publish v0.0.1 Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release v0.0.1]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.0.1 >/dev/null 2>&1; then
            gh release upload v0.0.1 LuluCalendar-v0.0.1.apk --clobber
          else
            gh release create v0.0.1 LuluCalendar-v0.0.1.apk \
              --target "$GITHUB_SHA" \
              --title "LuluCalendar v0.0.1" \
              --notes "LuluCalendar 首个定制版本：默认中文，并移除 Restore、错误报告、支持、桌面 Widget、设备日历同步与事件导入功能。"
          fi
