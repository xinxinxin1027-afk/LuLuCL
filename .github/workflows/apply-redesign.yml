name: Apply calendar redesign

on:
  push:
    branches:
      - redesign-stage

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: redesign-stage
          fetch-depth: 0

      - name: Reconstruct redesigned sources
        shell: bash
        run: |
          set -euo pipefail
          TARGET='app/src/main/java/com/vishal2376/snaptick/presentation/calender_screen'
          mkdir -p "$TARGET"
          cat .patch_payload/CalendarSheets.kt.part001 .patch_payload/CalendarSheets.kt.part002 .patch_payload/CalendarSheets.kt.part003 > "$TARGET/CalendarSheets.kt"
          cat .patch_payload/CalendarTaskEditor.kt.part001 .patch_payload/CalendarTaskEditor.kt.part002 .patch_payload/CalendarTaskEditor.kt.part003 > "$TARGET/CalendarTaskEditor.kt"
          cat .patch_payload/CalenderScreen.kt.part001 .patch_payload/CalenderScreen.kt.part002 .patch_payload/CalenderScreen.kt.part003 > "$TARGET/CalenderScreen.kt"
          rm -rf .patch_payload
          rm -f .github/workflows/apply-redesign.yml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Verify Android build
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Commit verified source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: redesign LuluCalendar calendar experience'
          git push origin HEAD:redesign-stage
